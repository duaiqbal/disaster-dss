name: disaster_dss
description: Offline-first disaster decision-support app (Chitral/KP)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.8.3
  path_provider: ^2.1.1
  geolocator: ^10.1.0
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  onnxruntime: ^1.4.1
  dart_sentencepiece_tokenizer: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/offline_package/
    - assets/onnx_model/
    
